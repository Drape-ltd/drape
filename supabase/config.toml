# Supabase project config for Drapeon V1
# Project: https://pqptfuqogvrajozfsqzi.supabase.co


[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "https://drapeon.co"
additional_redirect_urls = [
  "https://drapeon.co/auth/callback",
  "https://drapeon.co/auth/recover",
  "https://www.drapeon.co/auth/callback",
  "https://www.drapeon.co/auth/recover",
  "drape://callback",
  "drape:///callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/recover",
  "https://localhost:3000/auth/callback",
  "https://localhost:3000/auth/recover",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.notification.email_changed]
enabled = true
subject = "Your Drapeon email address was changed"
content_path = "./templates/email_changed_notification.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Drapeon password was changed"
content_path = "./templates/password_changed_notification.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"

# All functions handle their own JWT verification via getAuthUser() in _shared/auth.ts.
# verify_jwt = false skips the runtime's built-in HS256 check, which would reject ES256
# user JWTs (Supabase's current JWT format). Auth is enforced at the function level.
[functions.tailor-order-action]
verify_jwt = false

