# Reusable: sign in as test tailor from Welcome or Sign In screen.
---
- tapOn: "Continue with email"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
- tapOn:
    id: "email-input"
- eraseText
- setClipboard: "${DRAPE_TEST_TAILOR_EMAIL}"
- pasteText
- tapOn:
    id: "password-input"
- eraseText
- setClipboard: "${DRAPE_TEST_PASSWORD}"
- pasteText
- pressKey: Enter
- extendedWaitUntil:
    visible: "Your orders"
    timeout: 8000
