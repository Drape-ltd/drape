# Reusable: sign in as test customer from Welcome or Sign In screen.
---
- tapOn: "Sign in"
- tapOn:
    id: "email-input"
- inputText: "${DRAPE_TEST_CUSTOMER_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${DRAPE_TEST_PASSWORD}"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Discover tailors"
    timeout: 8000
