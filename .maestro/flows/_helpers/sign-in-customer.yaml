# Reusable: sign in as test customer from Welcome or Sign In screen.
---
- tapOn: "Continue with email"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
- tapOn:
    id: "email-input"
- eraseText
- setClipboard: "${DRAPE_TEST_CUSTOMER_EMAIL}"
- pasteText
- tapOn:
    id: "password-input"
- eraseText
- setClipboard: "${DRAPE_TEST_PASSWORD}"
- pasteText
- pressKey: Enter
- extendedWaitUntil:
    visible: "Find your tailor"
    timeout: 8000
