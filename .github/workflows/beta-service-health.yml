name: Drapeon Service Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: drapeon-service-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DRAPE_HEALTHCHECK_SECRET: ${{ secrets.DRAPE_HEALTHCHECK_SECRET }}
      DRAPE_PROD_HEALTHCHECK_SECRET: ${{ secrets.DRAPE_PROD_HEALTHCHECK_SECRET }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: C0BSXPAGVEX
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4

      - name: Find previous health state
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_run_id="$(
            gh api \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/beta-service-health.yml/runs?status=completed&per_page=1" \
              --jq '.workflow_runs[0].id // empty'
          )"
          echo "run_id=$previous_run_id" >> "$GITHUB_OUTPUT"

      - name: Restore previous health state
        if: ${{ steps.previous.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: beta-service-health-state
          path: /tmp/previous-health
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check Drapeon and provider health
        id: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-health
          node scripts/external-service-health.mjs --output /tmp/current-health/report.json
          jq -r '.state' /tmp/current-health/report.json > /tmp/current-health/state
          jq -r '.fingerprint' /tmp/current-health/report.json > /tmp/current-health/fingerprint
          {
            echo "current=$(jq -r '.state' /tmp/current-health/report.json)"
            echo "fingerprint=$(jq -r '.fingerprint' /tmp/current-health/report.json)"
            echo "summary=$(jq -r '.summary | gsub("[\\r\\n]+"; " ")' /tmp/current-health/report.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Report missing protected-readiness secrets
        if: ${{ env.DRAPE_HEALTHCHECK_SECRET == '' || env.DRAPE_PROD_HEALTHCHECK_SECRET == '' }}
        shell: bash
        run: |
          [[ -n "$DRAPE_HEALTHCHECK_SECRET" ]] || echo "::warning::DRAPE_HEALTHCHECK_SECRET is missing; DEV protected readiness is not monitored."
          [[ -n "$DRAPE_PROD_HEALTHCHECK_SECRET" ]] || echo "::warning::DRAPE_PROD_HEALTHCHECK_SECRET is missing; PROD protected readiness is not monitored."

      - name: Notify only when the incident changes
        if: ${{ always() }}
        env:
          CURRENT: ${{ steps.state.outputs.current }}
          FINGERPRINT: ${{ steps.state.outputs.fingerprint }}
          SUMMARY: ${{ steps.state.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          previous="unknown"
          previous_fingerprint="unknown"
          if [[ -f /tmp/previous-health/state ]]; then
            previous="$(tr -d '\r\n' < /tmp/previous-health/state)"
          fi
          if [[ -f /tmp/previous-health/fingerprint ]]; then
            previous_fingerprint="$(tr -d '\r\n' < /tmp/previous-health/fingerprint)"
          fi

          send_slack() {
            local heading="$1"
            local emoji="$2"
            if [[ -z "$SLACK_BOT_TOKEN" ]]; then
              echo "::warning::SLACK_BOT_TOKEN is missing; GitHub remains the alert fallback."
              jq -n \
                --arg deliveredAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{ok: false, error: "missing_token", deliveredAt: $deliveredAt}' \
                > /tmp/current-health/slack-delivery.json
              return 0
            fi
            payload="$(jq -n \
              --arg channel "$SLACK_CHANNEL_ID" \
              --arg text "$emoji *$heading*\n$SUMMARY\n<https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID|Open monitor run> · <https://ops.drapeon.co/ops?view=workflow-issues|Open Drapeon Ops>" \
              '{channel: $channel, text: $text, unfurl_links: false}')"
            response="$(curl --silent --show-error --max-time 15 \
              --header "Authorization: Bearer $SLACK_BOT_TOKEN" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data "$payload" \
              https://slack.com/api/chat.postMessage || true)"
            if ! jq -e '.ok == true' <<<"$response" >/dev/null 2>&1; then
              echo "::warning::Slack alert failed; GitHub remains the alert fallback."
              jq -n \
                --arg error "$(jq -r '.error // "unknown_error"' <<<"$response" 2>/dev/null || printf unknown_error)" \
                --arg deliveredAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{ok: false, error: $error, deliveredAt: $deliveredAt}' \
                > /tmp/current-health/slack-delivery.json
              return 0
            fi
            jq -n \
              --arg channel "$(jq -r '.channel // empty' <<<"$response")" \
              --arg messageTs "$(jq -r '.ts // empty' <<<"$response")" \
              --arg deliveredAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{ok: true, channel: $channel, messageTs: $messageTs, deliveredAt: $deliveredAt}' \
              > /tmp/current-health/slack-delivery.json
          }

          if [[ "$CURRENT" == "fail" && "$previous" == "fail" && "$FINGERPRINT" == "$previous_fingerprint" ]]; then
            if [[ -f /tmp/previous-health/slack-delivery.json ]]; then
              cp /tmp/previous-health/slack-delivery.json /tmp/current-health/slack-delivery.json
            fi
            echo "::warning title=Ongoing Drapeon service incident::$SUMMARY"
            echo "The same incident is still open; duplicate GitHub and Slack alerts were suppressed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$CURRENT" == "fail" ]]; then
            send_slack "Drapeon service incident changed" ":rotating_light:"
            echo "::error title=Drapeon service incident::$SUMMARY"
            echo "A new or changed service incident was detected: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$previous" == "fail" ]]; then
            send_slack "Drapeon services recovered" ":white_check_mark:"
            echo "::notice title=Drapeon services recovered::$SUMMARY"
            echo "The prior service incident recovered." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Drapeon and monitored provider health remains clear." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist health state and notification outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beta-service-health-state
          path: /tmp/current-health
          retention-days: 7
          if-no-files-found: error
